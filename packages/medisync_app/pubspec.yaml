name: medisync_app
description: MediSync patient mobile app
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegación
  go_router: ^14.2.7

  # UI
  fl_chart: ^0.69.0
  local_auth: ^2.3.0
  shimmer: ^3.0.0

  # Core propio
  medisync_core:
    path: ../medisync_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_medisync.png