name: medisync_web
description: MediSync lab and doctor web panel
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegación
  go_router: ^14.2.7

  # UI Web
  fl_chart: ^0.69.0
  data_table_2: ^2.5.12

  # Core propio
  medisync_core:
    path: ../medisync_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true