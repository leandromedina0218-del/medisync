name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-core:
    name: Test medisync_core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        working-directory: packages/medisync_core
        run: dart pub get
      - name: Analyze
        working-directory: packages/medisync_core
        run: dart analyze
      - name: Run tests
        working-directory: packages/medisync_core
        run: dart test

  test-app:
    name: Analyze medisync_app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable
      - name: Install dependencies
        working-directory: packages/medisync_app
        run: flutter pub get
      - name: Analyze
        working-directory: packages/medisync_app
        run: flutter analyze